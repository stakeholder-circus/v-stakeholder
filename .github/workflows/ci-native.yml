name: ci-native

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  native:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            binary: bin/stakeholder
          - os: macos-latest
            binary: bin/stakeholder
          - os: windows-latest
            binary: bin/stakeholder.exe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: vlang/setup-v@663cc08827d1fc0532ee755b4dedbb183c11d06a # v1.7
        with:
          token: ${{ github.token }}
          version: 7647ce1c6fad63b5578bc07883139906de74b2f8
      - name: Format check
        shell: bash
        run: v fmt -verify src/main.v
      - name: Build deterministic runtime
        shell: bash
        run: |
          mkdir -p bin
          v -gc none -o "${{ matrix.binary }}" src/main.v
      - name: CLI contract tests
        shell: bash
        run: BIN="${{ matrix.binary }}" tests/test_cli.sh
