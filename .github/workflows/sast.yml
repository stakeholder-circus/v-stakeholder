name: sast

on:
  workflow_dispatch:
  push:
  pull_request:
  schedule:
    - cron: '31 3 * * 1'

permissions:
  contents: read

jobs:
  v-vet:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install verified V release
        run: scripts/setup_v_release.sh
      - run: v vet src/main.v
